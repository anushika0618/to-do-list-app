<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow — To-Do App</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #0f0f13;
      --surface:   #17171e;
      --card:      #1e1e28;
      --border:    #2a2a38;
      --accent:    #7c6af7;
      --accent2:   #f97b6b;
      --green:     #4ade80;
      --text:      #e8e8f0;
      --muted:     #6b6b80;
      --done-text: #3d3d52;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 0;
    }
    .header { width:100%; max-width:560px; margin-bottom:36px; position:relative; z-index:1; }
    .header-top { display:flex; align-items:center; gap:14px; margin-bottom:6px; }
    .logo { width:40px; height:40px; background:var(--accent); border-radius:10px; display:grid; place-items:center; font-family:'Space Mono',monospace; font-size:18px; font-weight:700; color:#fff; flex-shrink:0; box-shadow:0 0 24px rgba(124,106,247,0.4); }
    h1 { font-family:'Space Mono',monospace; font-size:clamp(22px,5vw,28px); font-weight:700; letter-spacing:-0.5px; }
    h1 span { color:var(--accent); }
    .subtitle { font-size:13px; color:var(--muted); padding-left:54px; }
    .stats { display:flex; gap:6px; margin-bottom:20px; position:relative; z-index:1; width:100%; max-width:560px; }
    .stat { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 14px; text-align:center; }
    .stat-num { font-family:'Space Mono',monospace; font-size:22px; font-weight:700; line-height:1; margin-bottom:3px; }
    .stat-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.8px; }
    .stat:nth-child(1) .stat-num { color:var(--text); }
    .stat:nth-child(2) .stat-num { color:var(--accent); }
    .stat:nth-child(3) .stat-num { color:var(--green); }
    .progress-wrap { width:100%; max-width:560px; margin-bottom:20px; position:relative; z-index:1; }
    .progress-label { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.6px; }
    .progress-track { height:4px; background:var(--surface); border-radius:99px; overflow:hidden; }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--green)); border-radius:99px; transition:width 0.5s cubic-bezier(.4,0,.2,1); width:0%; }
    .input-wrap { width:100%; max-width:560px; display:flex; gap:10px; margin-bottom:24px; position:relative; z-index:1; }
    .task-input { flex:1; background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:14px 18px; font-family:'DM Sans',sans-serif; font-size:15px; color:var(--text); outline:none; transition:border-color 0.2s,box-shadow 0.2s; }
    .task-input::placeholder { color:var(--muted); }
    .task-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(124,106,247,0.15); }
    .priority-select { background:var(--surface); border:1.5px solid var(--border); border-radius:10px; padding:0 10px; height:50px; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:13px; cursor:pointer; outline:none; flex-shrink:0; }
    .priority-select:focus { border-color:var(--accent); }
    .add-btn { background:var(--accent); border:none; border-radius:12px; width:50px; height:50px; cursor:pointer; font-size:24px; color:#fff; display:grid; place-items:center; transition:transform 0.15s,box-shadow 0.15s; flex-shrink:0; box-shadow:0 4px 16px rgba(124,106,247,0.35); }
    .add-btn:hover { transform:scale(1.07); box-shadow:0 6px 22px rgba(124,106,247,0.5); }
    .add-btn:active { transform:scale(0.96); }
    .filters { width:100%; max-width:560px; display:flex; gap:6px; margin-bottom:16px; position:relative; z-index:1; }
    .filter-btn { flex:1; padding:8px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; cursor:pointer; transition:all 0.2s; }
    .filter-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    .task-list { width:100%; max-width:560px; display:flex; flex-direction:column; gap:10px; position:relative; z-index:1; }
    .task-item { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; display:flex; align-items:center; gap:14px; animation:slideIn 0.25s ease; transition:border-color 0.2s,opacity 0.2s; }
    .task-item:hover { border-color:var(--accent); }
    .task-item.done { opacity:0.5; }
    @keyframes slideIn { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
    .check-wrap { width:22px; height:22px; flex-shrink:0; position:relative; }
    .check-wrap input[type="checkbox"] { position:absolute; opacity:0; width:100%; height:100%; cursor:pointer; margin:0; }
    .check-box { width:22px; height:22px; border-radius:6px; border:2px solid var(--border); background:transparent; display:grid; place-items:center; transition:all 0.2s; pointer-events:none; }
    .check-wrap input:checked + .check-box { background:var(--green); border-color:var(--green); }
    .check-box svg { width:13px; height:13px; stroke:#fff; stroke-width:2.5; fill:none; opacity:0; transform:scale(0.5); transition:all 0.15s; }
    .check-wrap input:checked + .check-box svg { opacity:1; transform:scale(1); }
    .task-text { flex:1; font-size:15px; color:var(--text); word-break:break-word; transition:color 0.2s; }
    .done .task-text { color:var(--done-text); text-decoration:line-through; }
    .priority { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .priority.high   { background:var(--accent2); box-shadow:0 0 6px var(--accent2); }
    .priority.normal { background:var(--accent);  box-shadow:0 0 6px var(--accent); }
    .priority.low    { background:var(--muted); }
    .del-btn { background:none; border:none; color:var(--muted); cursor:pointer; font-size:18px; line-height:1; padding:2px 4px; border-radius:4px; transition:color 0.2s,background 0.2s; flex-shrink:0; }
    .del-btn:hover { color:var(--accent2); background:rgba(249,123,107,0.1); }
    .empty { text-align:center; padding:48px 0; color:var(--muted); }
    .empty-icon { font-size:40px; margin-bottom:12px; }
    .empty p { font-size:14px; }
    .bottom-bar { width:100%; max-width:560px; display:flex; justify-content:flex-end; margin-top:16px; position:relative; z-index:1; }
    .clear-btn { background:none; border:1px solid var(--border); border-radius:8px; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:12px; padding:7px 14px; cursor:pointer; transition:all 0.2s; }
    .clear-btn:hover { border-color:var(--accent2); color:var(--accent2); }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <div class="logo">✓</div>
      <h1>Task<span>Flow</span></h1>
    </div>
    <div class="subtitle">Stay focused. Ship things.</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="totalCount">0</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-num" id="activeCount">0</div><div class="stat-label">Active</div></div>
    <div class="stat"><div class="stat-num" id="doneCount">0</div><div class="stat-label">Done</div></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-label"><span>Progress</span><span id="progressPct">0%</span></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <div class="input-wrap">
    <input class="task-input" id="taskInput" placeholder="What needs to be done?" maxlength="120" />
    <select class="priority-select" id="prioritySelect">
      <option value="normal">● Normal</option>
      <option value="high">● High</option>
      <option value="low">● Low</option>
    </select>
    <button class="add-btn" id="addBtn" title="Add task">+</button>
  </div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="done">Done</button>
  </div>
  <div class="task-list" id="taskList"></div>
  <div class="bottom-bar">
    <button class="clear-btn" id="clearDone">Clear completed</button>
  </div>
  <script>
    let tasks = JSON.parse(localStorage.getItem('taskflow_tasks') || '[]');
    let filter = 'all';

    function save() { localStorage.setItem('taskflow_tasks', JSON.stringify(tasks)); }

    function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      if (!text) {
        input.focus();
        input.style.borderColor = 'var(--accent2)';
        setTimeout(() => input.style.borderColor = '', 600);
        return;
      }
      const priority = document.getElementById('prioritySelect').value;
      tasks.unshift({ id: Date.now(), text, done: false, priority });
      input.value = '';
      input.focus();
      save();
      render();
    }

    function toggleTask(id) {
      const t = tasks.find(t => t.id === id);
      if (t) { t.done = !t.done; save(); render(); }
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      save();
      render();
    }

    function clearDone() {
      tasks = tasks.filter(t => !t.done);
      save();
      render();
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function render() {
      const list = document.getElementById('taskList');
      const total = tasks.length;
      const done  = tasks.filter(t => t.done).length;
      const active = total - done;
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      document.getElementById('totalCount').textContent  = total;
      document.getElementById('activeCount').textContent = active;
      document.getElementById('doneCount').textContent   = done;
      document.getElementById('progressPct').textContent = pct + '%';
      document.getElementById('progressFill').style.width = pct + '%';
      const visible = tasks.filter(t => {
        if (filter === 'active') return !t.done;
        if (filter === 'done')   return t.done;
        return true;
      });
      if (visible.length === 0) {
        const msgs = { all:['📭','No tasks yet. Add one above!'], active:['🎉','All caught up!'], done:['📝','Nothing completed yet.'] };
        const [icon, msg] = msgs[filter];
        list.innerHTML = '<div class="empty"><div class="empty-icon">'+icon+'</div><p>'+msg+'</p></div>';
        return;
      }
      list.innerHTML = visible.map(t => `
        <div class="task-item ${t.done ? 'done' : ''}">
          <label class="check-wrap">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})"/>
            <div class="check-box"><svg viewBox="0 0 12 10"><polyline points="1,5 4.5,9 11,1"/></svg></div>
          </label>
          <span class="task-text">${escapeHtml(t.text)}</span>
          <span class="priority ${t.priority}" title="${t.priority} priority"></span>
          <button class="del-btn" onclick="deleteTask(${t.id})" title="Delete">×</button>
        </div>
      `).join('');
    }

    document.getElementById('addBtn').addEventListener('click', addTask);
    document.getElementById('taskInput').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
    document.getElementById('clearDone').addEventListener('click', clearDone);
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        filter = btn.dataset.filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      });
    });
    render();
  </script>
</body>
</html>
