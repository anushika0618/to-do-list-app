<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f0f13" />
  <meta name="description" content="TaskFlow is a focused to-do app with priorities, due dates and progress tracking." />
  <title>TaskFlow — To-Do App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0f0f13;--surface:#17171e;--card:#1e1e28;--border:#303041;--accent:#8b7cf6;--accent2:#f97b6b;--green:#4ade80;--text:#e8e8f0;--muted:#a0a0b3;--done:#77778b}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px 72px}
    .header,.stats,.progress-wrap,.input-wrap,.filters,.task-list,.bottom-bar{width:100%;max-width:680px;position:relative;z-index:1}
    .header{margin-bottom:30px}.header-top{display:flex;align-items:center;gap:14px;margin-bottom:6px}
    .logo{width:42px;height:42px;background:var(--accent);border-radius:11px;display:grid;place-items:center;font:700 19px 'Space Mono';color:white}
    h1{font:700 clamp(23px,5vw,29px) 'Space Mono';letter-spacing:-.6px}h1 span{color:var(--accent)}
    .subtitle{font-size:13px;color:var(--muted);padding-left:56px}
    .stats{display:flex;gap:8px;margin-bottom:18px}.stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px;text-align:center}
    .stat-num{font:700 22px 'Space Mono';margin-bottom:4px}.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
    .progress-wrap{margin-bottom:20px}.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.6px}
    .progress-track{height:6px;background:var(--surface);border-radius:99px;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .25s}
    .input-wrap{display:grid;grid-template-columns:minmax(160px,1fr) auto auto;gap:9px;margin-bottom:10px}
    input,select,button{font:inherit}.task-input,.priority-select,.due-input,.edit-input,.edit-form select{background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);min-height:46px;padding:10px 13px;outline:none}
    .task-input:focus,.priority-select:focus,.due-input:focus,.edit-input:focus,.edit-form select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #8b7cf626}
    .task-input::placeholder{color:var(--muted)}.priority-select,.due-input{font-size:12px;max-width:140px}
    .add-btn{width:48px;border:0;border-radius:10px;background:var(--accent);color:white;font-size:24px;cursor:pointer}
    .secondary-inputs{width:100%;max-width:680px;display:flex;gap:9px;justify-content:flex-end;margin-bottom:22px}
    .hint{font-size:11px;color:var(--muted);margin-right:auto;align-self:center}
    .filters{display:flex;gap:7px;margin-bottom:14px}.filter-btn{flex:1;padding:9px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:13px;cursor:pointer}
    .filter-btn.active{background:var(--accent);border-color:var(--accent);color:white}
    button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #c0b8ff;outline-offset:2px}
    .task-list{display:flex;flex-direction:column;gap:9px}.task-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;min-width:0}
    .task-item:hover{border-color:var(--accent)}.task-item.done{opacity:.62}
    .check-wrap{display:grid;place-items:center;flex-shrink:0}.check-wrap input{width:19px;height:19px;accent-color:var(--green);cursor:pointer}
    .task-details{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.task-text{font-size:14px;overflow-wrap:anywhere}.done .task-text{text-decoration:line-through;color:var(--done)}
    .due-date{font-size:11px;color:var(--muted)}.due-date.overdue{color:var(--accent2);font-weight:700}
    .priority{font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-radius:99px;padding:4px 7px;background:#ffffff0c;color:var(--muted);white-space:nowrap}
    .priority.high{color:#ff9a8d;background:#f97b6b1b}.priority.normal{color:#b8adff;background:#8b7cf61c}.priority.low{color:#b7b7c7}
    .action-btn,.del-btn{background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--muted);padding:6px 9px;font-size:11px;cursor:pointer;white-space:nowrap}
    .action-btn:hover{border-color:var(--accent);color:var(--text)}.del-btn{font-size:17px;padding:2px 8px}.del-btn:hover{color:var(--accent2);border-color:var(--accent2)}
    .edit-form{display:flex;gap:7px;flex:1;flex-wrap:wrap}.edit-input{flex:1;min-width:130px}.edit-form select,.edit-form input[type=date]{min-height:38px;max-width:145px;font-size:12px}
    .empty{text-align:center;padding:42px 12px;color:var(--muted);font-size:14px}
    .bottom-bar{display:flex;justify-content:flex-end;margin-top:14px}.clear-btn{background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);padding:8px 12px;font-size:12px;cursor:pointer}.clear-btn:hover{border-color:var(--accent2);color:var(--accent2)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:560px){body{padding:28px 13px 55px}.input-wrap{grid-template-columns:1fr 48px}.task-input{grid-column:1/2}.priority-select{grid-column:1/2;max-width:none}.add-btn{grid-column:2;grid-row:1/3}.secondary-inputs{justify-content:space-between}.hint{font-size:10px}.task-item{gap:8px;padding:11px}.priority{font-size:9px}.action-btn{padding:6px}.edit-form{width:100%}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <header class="header"><div class="header-top"><div class="logo" aria-hidden="true">✓</div><h1>Task<span>Flow</span></h1></div><p class="subtitle">Stay focused. Ship things.</p></header>
  <section class="stats" aria-label="Task statistics">
    <div class="stat"><div class="stat-num" id="totalCount">0</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-num" id="activeCount">0</div><div class="stat-label">Active</div></div>
    <div class="stat"><div class="stat-num" id="doneCount">0</div><div class="stat-label">Done</div></div>
  </section>
  <section class="progress-wrap" aria-label="Completion progress"><div class="progress-label"><span>Progress</span><span id="progressPct">0%</span></div><div class="progress-track" role="progressbar" aria-label="Tasks completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div></section>
  <form class="input-wrap" id="taskForm">
    <label class="sr-only" for="taskInput">Task description</label><input class="task-input" id="taskInput" placeholder="What needs to be done?" maxlength="120" required />
    <label class="sr-only" for="prioritySelect">Priority</label><select class="priority-select" id="prioritySelect"><option value="normal">Normal priority</option><option value="high">High priority</option><option value="low">Low priority</option></select>
    <button class="add-btn" id="addBtn" type="submit" aria-label="Add task" title="Add task">+</button>
  </form>
  <div class="secondary-inputs"><span class="hint">Press Enter to add · Esc to clear</span><label class="sr-only" for="dueDateInput">Optional due date</label><input class="due-input" id="dueDateInput" type="date" aria-label="Optional due date" /></div>
  <nav class="filters" aria-label="Filter tasks"><button class="filter-btn active" data-filter="all" aria-pressed="true">All</button><button class="filter-btn" data-filter="active" aria-pressed="false">Active</button><button class="filter-btn" data-filter="done" aria-pressed="false">Done</button></nav>
  <main class="task-list" id="taskList" aria-label="Tasks"></main>
  <div class="bottom-bar"><button class="clear-btn" id="clearDone" type="button">Clear completed</button></div>
  <p id="liveMessage" class="sr-only" role="status" aria-live="polite"></p>
  <script type="module" src="./app.js"></script>
</body>
</html>
